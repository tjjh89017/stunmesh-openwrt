# stunmesh-go configuration. Reference: https://docs.stunmesh.dev/configuration/overview
#
# Edit this file, then: /etc/init.d/stunmesh enable && /etc/init.d/stunmesh start
# The service refuses to start while this file is empty, and restarts itself
# when the file changes.
---
refresh_interval: "1m"
log:
  level: "info"
interfaces:
  wg0:
    peers:
      "peer-b":
        public_key: "<PEER_B_PUBLIC_KEY_BASE64>"
        plugin: dht
stun:
  addresses: ["stun.l.google.com:19302"]
plugins:
  dht:
    type: builtin
    name: opendht
    endpoints:
      - https://dhtproxy2.jami.net
      - https://dhtproxy3.jami.net
