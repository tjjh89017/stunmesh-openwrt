name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    name: Discover matrix
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.matrix.outputs.releases }}
      archs: ${{ steps.matrix.outputs.archs }}
      packages: ${{ steps.matrix.outputs.packages }}
      dirs: ${{ steps.matrix.outputs.dirs }}
      dir_names: ${{ steps.matrix.outputs.dir_names }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: ./.github/actions/matrix

  # One job per (release, arch, feed directory): OpenWrt's build system
  # only exposes one top-level "make package/<X>/..." target per
  # Makefile, named after the directory it lives in, not per
  # "define Package/<name>" block -- building "stunmesh-provisioner"
  # once here also builds its sibling package "stunmesh-provd", so
  # matrixing on package names here would (and, before this comment,
  # did) build that same directory twice per release/arch for no reason.
  # This job uploads one combined artifact per directory; the "split"
  # job below re-packages it into the one artifact per *package* the
  # rest of the pipeline (and the "feed" job's merge/index step) expects.
  build:
    name: >-
      ${{ matrix.dir }}
      (${{ join(fromJSON(needs.matrix.outputs.dirs)[matrix.dir], ', ') }})
      ${{ matrix.arch }} ${{ matrix.release }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.matrix.outputs.releases) }}
        arch: ${{ fromJSON(needs.matrix.outputs.archs) }}
        dir: ${{ fromJSON(needs.matrix.outputs.dir_names) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve this directory's packages
        id: resolve
        env:
          DIR: ${{ matrix.dir }}
          DIRS_JSON: ${{ needs.matrix.outputs.dirs }}
        run: |
          set -eu
          packages="$(printf '%s' "$DIRS_JSON" | jq -r --arg d "$DIR" '.[$d] | join(" ")')"
          [ -n "$packages" ] || { echo "::error::no packages known for dir '$DIR'" >&2; exit 1; }
          echo "packages=$packages" | tee -a "$GITHUB_OUTPUT"
      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          arch: ${{ matrix.arch }}
          release: ${{ matrix.release }}
          package: ${{ matrix.dir }}
          select: ${{ steps.resolve.outputs.packages }}
          # This job builds one directory, which may cover more than one
          # package. "make package/index" only ever indexes what got
          # compiled in the same invocation, so a per-directory index
          # here would only ever list this directory's own package(s),
          # never the whole feed. The "feed" job rebuilds one real,
          # shared, signed index instead, once every package's .apk for
          # a release/arch has been collected -- see
          # .github/scripts/reindex.sh.
          index: '0'
          # Empty on pull requests from forks, which then build unsigned.
          private-key: ${{ secrets.APK_PRIVATE_KEY }}
      - name: Store directory build
        uses: actions/upload-artifact@v7
        with:
          name: dirbuild-${{ matrix.release }}__${{ matrix.arch }}__${{ matrix.dir }}
          path: ${{ steps.build.outputs.feed-dir }}/
          if-no-files-found: error

  # Fans a directory's combined build back out into one artifact per real
  # package (pkg-<release>__<arch>__<package>), so every job downstream of
  # this one -- the "feed" job's merge and EXPECTED_PACKAGES logic in
  # particular -- keeps working against individually named packages and
  # never needs to know which directory built which. This is deliberately
  # its own matrix job rather than a loop inside "build": a single
  # "actions/upload-artifact" step can only publish one artifact, and the
  # number of packages a directory owns is not known until "build"
  # actually ran, so producing N independently named artifacts needs
  # either N static steps (impossible for a dynamic N) or, as here, a
  # matrix over the flat package list.
  split:
    name: ${{ matrix.package }} ${{ matrix.arch }} ${{ matrix.release }}
    needs: [matrix, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.matrix.outputs.releases) }}
        arch: ${{ fromJSON(needs.matrix.outputs.archs) }}
        package: ${{ fromJSON(needs.matrix.outputs.packages) }}
    steps:
      - name: Resolve owning directory
        id: resolve
        env:
          PKG: ${{ matrix.package }}
          DIRS_JSON: ${{ needs.matrix.outputs.dirs }}
        run: |
          set -eu
          dir="$(printf '%s' "$DIRS_JSON" | jq -r --arg p "$PKG" 'to_entries[] | select(.value | index($p)) | .key' | head -1)"
          [ -n "$dir" ] || { echo "::error::no directory owns package '$PKG'" >&2; exit 1; }
          echo "dir=$dir" | tee -a "$GITHUB_OUTPUT"
      - name: Download directory build
        uses: actions/download-artifact@v8
        with:
          name: dirbuild-${{ matrix.release }}__${{ matrix.arch }}__${{ steps.resolve.outputs.dir }}
          path: dirbuild
      - name: Verify this package's files are present
        run: |
          set -eu
          src="dirbuild/${{ matrix.package }}"
          [ -d "$src" ] && [ -n "$(ls -A "$src" 2>/dev/null)" ] || {
            echo "::error::no files for package '${{ matrix.package }}' in the ${{ steps.resolve.outputs.dir }} directory build" >&2
            exit 1
          }
          ls -l "$src"
      - name: Store package
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.release }}__${{ matrix.arch }}__${{ matrix.package }}
          path: dirbuild/${{ matrix.package }}/
          if-no-files-found: error

  # Publish every feed directory to GitHub Pages so routers can add
  # https://<owner>.github.io/stunmesh-openwrt/<release>/<arch>/packages.adb
  # as a repository. Only from main, so PR builds never touch the feed.
  feed:
    name: Publish feed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [matrix, split]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: pkgs
          pattern: pkg-*

      - name: Merge packages by release/arch
        run: |
          set -eu
          mkdir -p merged
          for d in pkgs/pkg-*; do
            n="${d#pkgs/pkg-}"     # "<release>__<arch>__<package>"
            rel="${n%%__*}"
            rest="${n#*__}"        # "<arch>__<package>"
            arch="${rest%%__*}"
            mkdir -p "merged/$rel/$arch"
            cp "$d"/* "merged/$rel/$arch/"
          done
          find merged -type f | sort

      # Rebuild one real, shared, signed index per release/arch, covering
      # every package that landed there (each "build" job above built only
      # one). apk (apk-tools v3) is a host tool -- it runs on the CI
      # runner's own x86_64 Linux, not on the target device's architecture
      # -- so one SDK pull per *release*, not per target arch, is enough;
      # .github/scripts/reindex.sh loops over every arch directory itself.
      #
      # This step, not the build jobs, is what can actually break the
      # feed (a bad apk invocation, a signature that fails to verify), so
      # it validates its own output before returning success: a failure
      # here fails this job, and "Assemble site"/deploy-pages never run --
      # a broken or falsely-"signed" feed is never published.
      #
      # Runs the container as root: reindex.sh now apt-get installs its
      # own build dependencies and builds apk-tools from source (see its
      # header comment) instead of using the SDK's bundled apk-tools
      # 3.0.5, which has a memory-safety bug in the ADB-block reader
      # mkndx uses, fixed upstream after 3.0.5 (and after the latest
      # tagged release, 3.0.7) but not yet in any release. Runs
      # 33145097157 and 33148529465 both crashed here on the exact same
      # cell (SNAPSHOT, aarch64_cortex-a53) with "Segmentation fault
      # (core dumped)" from apk mkndx (exit 139) -- 33148529465 crashed
      # on 2 consecutive retries of the *old* apk-tools 3.0.5 path,
      # which is what disproved this being simple runner flakiness a
      # retry alone could paper over (see reindex.sh for the full
      # writeup and the exact upstream commit). The retry loop stays as
      # a second line of defense for unrelated transient failures (a
      # flaky apt/git-clone), not as the fix for this crash.
      - name: Rebuild shared index and verify
        env:
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          EXPECTED_PACKAGES: ${{ join(fromJSON(needs.matrix.outputs.packages), ' ') }}
        run: |
          set -eu
          printf '%s' "$PRIVATE_KEY" > private-key.pem
          mkdir -p pubkeys
          cp keys/stunmesh.pem pubkeys/
          for rel_dir in merged/*/; do
            rel="$(basename "$rel_dir")"
            echo "::group::Reindex $rel"
            attempt=1
            max_attempts=3
            until docker run --rm --user root \
              -e EXPECTED_PACKAGES \
              -v "$PWD/merged/$rel:/feed" \
              -v "$PWD/private-key.pem:/private-key.pem:ro" \
              -v "$PWD/pubkeys:/pubkeys:ro" \
              -v "$PWD/.github/scripts/reindex.sh:/reindex.sh:ro" \
              "ghcr.io/openwrt/sdk:x86_64-$rel" \
              sh /reindex.sh
            do
              rc=$?
              echo "::warning::reindex for $rel failed (exit $rc), attempt $attempt/$max_attempts"
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::endgroup::"
                exit "$rc"
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "::endgroup::"
          done
          rm -f private-key.pem

      - name: Assemble site
        run: |
          set -eu
          mkdir -p site
          cp keys/stunmesh.pem site/stunmesh.pem
          for rel_dir in merged/*/; do
            rel="$(basename "$rel_dir")"
            for arch_dir in "$rel_dir"*/; do
              arch="$(basename "$arch_dir")"
              mkdir -p "site/$rel/$arch"
              cp "$arch_dir"* "site/$rel/$arch/"
            done
          done
          {
            echo '<!doctype html><title>stunmesh-openwrt feed</title><h1>stunmesh-openwrt package feed</h1>'
            echo '<p>Signing key: <a href="stunmesh.pem">stunmesh.pem</a>. Install instructions: <a href="https://github.com/${{ github.repository }}#readme">README</a>.</p><ul>'
            find site -name packages.adb -o -name Packages | sort | sed 's|^site/||; s|.*|<li><a href="&">&</a></li>|'
            echo '</ul>'
          } > site/index.html
          find site -type f | sort
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
