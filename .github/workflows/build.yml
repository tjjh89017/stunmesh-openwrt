name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    name: Discover matrix
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.matrix.outputs.releases }}
      archs: ${{ steps.matrix.outputs.archs }}
      packages: ${{ steps.matrix.outputs.packages }}
      package_dirs: ${{ steps.matrix.outputs.package_dirs }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: ./.github/actions/matrix

  build:
    name: ${{ matrix.package }} ${{ matrix.arch }} ${{ matrix.release }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.matrix.outputs.releases) }}
        arch: ${{ fromJSON(needs.matrix.outputs.archs) }}
        package: ${{ fromJSON(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # OpenWrt's build system only exposes one top-level
      # "make package/<X>/..." target per Makefile, named after the
      # directory it lives in -- not per "define Package/<name>" block.
      # matrix.package is the real, installable package name (what
      # gets built into a .apk and what the CI job/artifact is named
      # after); "dir" is the feed directory that actually builds it,
      # looked up from the matrix action's package_dirs map. They are
      # the same string for a directory with only one package (e.g.
      # stunmesh-go); "dir" differs for stunmesh-provd, which is built
      # from net/stunmesh-provisioner/Makefile alongside
      # stunmesh-provisioner itself. See .github/actions/matrix's
      # "Packages" step and .github/actions/build's "select" input.
      - name: Resolve package directory
        id: resolve
        env:
          PKG: ${{ matrix.package }}
          DIRS_JSON: ${{ needs.matrix.outputs.package_dirs }}
        run: |
          set -eu
          dir="$(printf '%s' "$DIRS_JSON" | jq -r --arg n "$PKG" '.[$n]')"
          [ -n "$dir" ] && [ "$dir" != null ] || { echo "::error::no directory known for package '$PKG'" >&2; exit 1; }
          echo "dir=$dir" | tee -a "$GITHUB_OUTPUT"
      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          arch: ${{ matrix.arch }}
          release: ${{ matrix.release }}
          package: ${{ steps.resolve.outputs.dir }}
          select: ${{ matrix.package }}
          # This job builds exactly one package. "make package/index" only
          # ever indexes what got compiled in the same invocation, so a
          # per-package index here would only ever list this one package
          # (and, when "dir" builds more than one, it would list whichever
          # of them happened to run last). The "feed" job rebuilds one
          # real, shared, signed index instead, once every package's .apk
          # for a release/arch has been collected -- see
          # .github/scripts/reindex.sh.
          index: '0'
          # Empty on pull requests from forks, which then build unsigned.
          private-key: ${{ secrets.APK_PRIVATE_KEY }}
      - name: Store package
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.release }}__${{ matrix.arch }}__${{ matrix.package }}
          path: ${{ steps.build.outputs.feed-dir }}/
          if-no-files-found: error

  # Publish every feed directory to GitHub Pages so routers can add
  # https://<owner>.github.io/stunmesh-openwrt/<release>/<arch>/packages.adb
  # as a repository. Only from main, so PR builds never touch the feed.
  feed:
    name: Publish feed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [matrix, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: pkgs
          pattern: pkg-*

      - name: Merge packages by release/arch
        run: |
          set -eu
          mkdir -p merged
          for d in pkgs/pkg-*; do
            n="${d#pkgs/pkg-}"     # "<release>__<arch>__<package>"
            rel="${n%%__*}"
            rest="${n#*__}"        # "<arch>__<package>"
            arch="${rest%%__*}"
            mkdir -p "merged/$rel/$arch"
            cp "$d"/* "merged/$rel/$arch/"
          done
          find merged -type f | sort

      # Rebuild one real, shared, signed index per release/arch, covering
      # every package that landed there (each "build" job above built only
      # one). apk (apk-tools v3) is a host tool -- it runs on the CI
      # runner's own x86_64 Linux, not on the target device's architecture
      # -- so one SDK pull per *release*, not per target arch, is enough;
      # .github/scripts/reindex.sh loops over every arch directory itself.
      #
      # This step, not the build jobs, is what can actually break the
      # feed (a bad apk invocation, a signature that fails to verify), so
      # it validates its own output before returning success: a failure
      # here fails this job, and "Assemble site"/deploy-pages never run --
      # a broken or falsely-"signed" feed is never published.
      - name: Rebuild shared index and verify
        env:
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          EXPECTED_PACKAGES: ${{ join(fromJSON(needs.matrix.outputs.packages), ' ') }}
        run: |
          set -eu
          printf '%s' "$PRIVATE_KEY" > private-key.pem
          mkdir -p pubkeys
          cp keys/stunmesh.pem pubkeys/
          for rel_dir in merged/*/; do
            rel="$(basename "$rel_dir")"
            echo "::group::Reindex $rel"
            docker run --rm \
              -e EXPECTED_PACKAGES \
              -v "$PWD/merged/$rel:/feed" \
              -v "$PWD/private-key.pem:/private-key.pem:ro" \
              -v "$PWD/pubkeys:/pubkeys:ro" \
              -v "$PWD/.github/scripts/reindex.sh:/reindex.sh:ro" \
              "ghcr.io/openwrt/sdk:x86_64-$rel" \
              sh /reindex.sh
            echo "::endgroup::"
          done
          rm -f private-key.pem

      - name: Assemble site
        run: |
          set -eu
          mkdir -p site
          cp keys/stunmesh.pem site/stunmesh.pem
          for rel_dir in merged/*/; do
            rel="$(basename "$rel_dir")"
            for arch_dir in "$rel_dir"*/; do
              arch="$(basename "$arch_dir")"
              mkdir -p "site/$rel/$arch"
              cp "$arch_dir"* "site/$rel/$arch/"
            done
          done
          {
            echo '<!doctype html><title>stunmesh-openwrt feed</title><h1>stunmesh-openwrt package feed</h1>'
            echo '<p>Signing key: <a href="stunmesh.pem">stunmesh.pem</a>. Install instructions: <a href="https://github.com/${{ github.repository }}#readme">README</a>.</p><ul>'
            find site -name packages.adb -o -name Packages | sort | sed 's|^site/||; s|.*|<li><a href="&">&</a></li>|'
            echo '</ul>'
          } > site/index.html
          find site -type f | sort
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
