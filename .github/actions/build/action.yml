name: Build OpenWrt packages
description: Build one or more stunmesh-openwrt packages with the OpenWrt SDK for one arch/release, sign them, index them together, and collect the feed directory

inputs:
  arch:
    description: 'OpenWrt package architecture (x86_64, mipsel_24kc, aarch64_cortex-a53, ...)'
    required: true
  release:
    description: 'OpenWrt release tag of the SDK container (openwrt-25.12, SNAPSHOT)'
    required: true
  private-key:
    description: 'PEM private key used to sign the packages and the index (empty = unsigned)'
    required: false
    default: ''
  package:
    description: >-
      Space-separated directory/PKG_NAME value(s) to pass as PACKAGES= to
      the OpenWrt SDK (what "make package/<X>/download" etc. actually
      resolve to), e.g. "stunmesh-go" or "stunmesh-provisioner" (a feed
      directory name, not necessarily a specific installable package name
      -- see "select" below when they differ).
    required: false
    default: stunmesh-go
  select:
    description: >-
      Space-separated real package name(s) whose .apk/.ipk output to
      collect, one subdirectory per name (see "feed-dir" below). Defaults
      to "package" (the common case: one directory building exactly the
      one package named the same as itself). Set this separately from
      "package" when a directory builds more than one installable
      package (e.g. net/stunmesh-provisioner/Makefile builds both
      "stunmesh-agent" and "stunmesh-provd"): pass the owning directory as
      "package" so the SDK's PACKAGES= build actually resolves, and every
      real package name that directory owns as "select", space-separated
      -- each is verified to have produced at least one file; a directory
      that silently dropped one of its own packages fails this action
      instead of publishing an incomplete set.
    required: false
    default: ''
  feedname:
    description: 'Feed name this repo is registered as in feeds.conf'
    required: false
    default: stunmesh
  index:
    description: >-
      Run "make package/index" (and sign it) after building, and collect the
      resulting packages.adb/Packages* alongside the package files. Set to
      '0' when this build covers only one package out of several that will
      share a feed directory: a per-package index would only ever list that
      one package, and the caller (the "feed" job) rebuilds one combined,
      signed index across every package instead.
    required: false
    default: '1'

outputs:
  feed-dir:
    description: >-
      Directory holding one subdirectory per name in "select"
      (feed-dir/<package>/*.apk, *.ipk), plus the index directly under
      feed-dir when index=1.
    value: out/feed

runs:
  using: composite
  steps:
    # Every build job used to spend 20+ minutes in golang-bootstrap/host
    # (go1.4 -> 1.17 -> 1.20 -> 1.22 -> 1.24, built from source) plus
    # 6-9 more compiling the final host golang1.26/golang1.27, because
    # openwrt/packages' lang/golang always builds its own bootstrap chain
    # unless CONFIG_GOLANG_BUILD_BOOTSTRAP=n. With that set,
    # lang/golang/golang-bootstrap's host-compile is a no-op and
    # lang/golang/golang-version.mk bootstraps the final host Go straight
    # from CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT:
    #
    #   ifeq ($(CONFIG_GOLANG_BUILD_BOOTSTRAP),y)
    #     BOOTSTRAP_DIR:=$(HOST_GO_PREFIX)/lib/go-$(GO_BOOTSTRAP_VERSION)
    #   else
    #     BOOTSTRAP_DIR:=$(call qstrip,$(CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT))
    #   endif
    #   ...
    #   define Host/Compile
    #     $(call GoCompiler/$(HOST_GO_PROFILE_ID)/Make, \
    #       GOROOT_BOOTSTRAP="$(BOOTSTRAP_DIR)" \
    #       ...
    #
    # go1.24.13 is the exact version openwrt/packages' own bootstrap
    # chain currently ends on, so it is a known-good bootstrap toolchain
    # for both golang1.26 and golang1.27 (Go's own minimum bootstrap
    # requirement for the 1.27 branch is go1.24.6).
    #
    # openwrt/gh-action-sdk gives no hook to edit .config before its
    # single internal "make defconfig" + build run, so this step drives
    # the same SDK container directly instead of through that action,
    # using a small wrapper entrypoint (.github/docker/openwrt-sdk-bootstrap)
    # vendored from gh-action-sdk@v11 with one patch: after "make
    # defconfig", set CONFIG_GOLANG_BUILD_BOOTSTRAP=n and
    # CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT to a prebuilt Go mounted
    # read-only at /go-bootstrap. Trade-off: this vendored entrypoint
    # must be re-synced by hand on a future gh-action-sdk version bump.
    - name: Pin the Go bootstrap toolchain version
      id: gobootstrap
      shell: bash
      run: |
        set -eu
        echo "version=1.24.13" >> "$GITHUB_OUTPUT"
        echo "sha256=1fc94b57134d51669c72173ad5d49fd62afb0f1db9bf3f798fd98ee423f8d730" >> "$GITHUB_OUTPUT"

    - name: Cache the Go bootstrap toolchain tarball
      id: gobootstrap-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/go-bootstrap-${{ steps.gobootstrap.outputs.version }}.tar.gz
        key: go-bootstrap-${{ steps.gobootstrap.outputs.version }}-linux-amd64

    - name: Download the Go bootstrap toolchain
      if: steps.gobootstrap-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GO_VERSION: ${{ steps.gobootstrap.outputs.version }}
      run: |
        set -eu
        curl -fsSL -o "${{ runner.temp }}/go-bootstrap-$GO_VERSION.tar.gz" \
          "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz"

    - name: Verify and extract the Go bootstrap toolchain
      shell: bash
      env:
        GO_VERSION: ${{ steps.gobootstrap.outputs.version }}
        GO_SHA256: ${{ steps.gobootstrap.outputs.sha256 }}
      run: |
        set -eu
        tarball="${{ runner.temp }}/go-bootstrap-$GO_VERSION.tar.gz"
        echo "$GO_SHA256  $tarball" | sha256sum -c -
        rm -rf "${{ runner.temp }}/go-bootstrap"
        mkdir -p "${{ runner.temp }}/go-bootstrap"
        # The release tarball's one top-level "go" directory becomes the
        # GOROOT that CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT points at.
        tar -C "${{ runner.temp }}/go-bootstrap" --strip-components=1 -xzf "$tarball"

    - name: Set up Docker QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build SDK image with the prebuilt Go bootstrap entrypoint
      uses: docker/build-push-action@v7
      env:
        ARCH: ${{ inputs.arch }}-${{ inputs.release }}
        DOCKER_BUILD_SUMMARY: false
      with:
        push: false
        tags: sdk-bootstrap
        context: ${{ github.action_path }}/../../docker/openwrt-sdk-bootstrap
        build-args: |
          ARCH
        cache-to: type=gha,mode=max,scope=stunmesh-openwrt-sdk-bootstrap-${{ inputs.arch }}-${{ inputs.release }}
        cache-from: type=gha,scope=stunmesh-openwrt-sdk-bootstrap-${{ inputs.arch }}-${{ inputs.release }}
        load: true

    # gh-action-sdk itself does this chown dance around its docker run:
    # the container's build user needs to own the checked-out feed (also
    # used as the artifacts dir) to write into it, and a later step must
    # give it back to the runner user so following steps can touch it.
    - name: chown the feed for the SDK container's build user
      shell: bash
      run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

    - name: Build with the OpenWrt SDK
      shell: bash
      env:
        FEEDNAME: ${{ inputs.feedname }}
        PACKAGES: ${{ inputs.package }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        INDEX: ${{ inputs.index }}
        V: s
      run: |
        set -eu
        docker run --rm \
          --env BUILD \
          --env BUILD_LOG \
          --env EXTRA_FEEDS \
          --env FEEDNAME \
          --env IGNORE_ERRORS \
          --env KEY_BUILD \
          --env PRIVATE_KEY \
          --env NO_DEFAULT_FEEDS \
          --env NO_REFRESH_CHECK \
          --env NO_SHFMT_CHECK \
          --env PACKAGES \
          --env INDEX \
          --env V \
          -v "$GITHUB_WORKSPACE:/artifacts" \
          -v "$GITHUB_WORKSPACE:/feed" \
          -v "${{ runner.temp }}/go-bootstrap:/go-bootstrap:ro" \
          sdk-bootstrap

    - name: Restore feed ownership
      if: always()
      shell: bash
      run: sudo chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

    - name: Collect packages
      shell: bash
      env:
        SELECT: ${{ inputs.select }}
      run: |
        set -eu
        src="bin/packages/${{ inputs.arch }}/${{ inputs.feedname }}"
        mkdir -p out/feed
        # Default "select" to "package": the common case is one directory
        # building exactly the one package named the same as itself.
        select="${SELECT:-${{ inputs.package }}}"
        missing=""
        for pkg in $select; do
          mkdir -p "out/feed/$pkg"
          found=0
          for f in "$src"/"$pkg"*.ipk "$src"/"$pkg"*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "out/feed/$pkg/"
            found=1
          done
          # Every name in "select" must produce its own file: a directory
          # that built fine but silently dropped one of its own packages
          # (a bad CONFIG_PACKAGE_* selection, a typo) fails loudly here
          # instead of shipping an incomplete feed.
          [ "$found" = 1 ] || missing="$missing $pkg"
        done
        if [ -n "$missing" ]; then
          echo "::error::no package produced in $src for:$missing" >&2
          ls -R bin || true
          exit 1
        fi
        if [ "${{ inputs.index }}" = '1' ]; then
          # The index is what apk fetches first; without it the feed is useless.
          for idx in packages.adb Packages Packages.gz Packages.sig; do
            [ -e "$src/$idx" ] && cp "$src/$idx" out/feed/
          done
          [ -e out/feed/packages.adb ] || [ -e out/feed/Packages ] || { echo "no package index produced in $src" >&2; ls -l "$src"; exit 1; }
        fi
        ls -lR out
