name: Build OpenWrt packages
description: Build one or more stunmesh-openwrt packages with the OpenWrt SDK for one arch/release, sign them, index them together, and collect the feed directory

inputs:
  arch:
    description: 'OpenWrt package architecture (x86_64, mipsel_24kc, aarch64_cortex-a53, ...)'
    required: true
  release:
    description: 'OpenWrt release tag of the SDK container (openwrt-25.12, SNAPSHOT)'
    required: true
  private-key:
    description: 'PEM private key used to sign the packages and the index (empty = unsigned)'
    required: false
    default: ''
  package:
    description: 'Space-separated package name(s) to build, e.g. "stunmesh-go stunmesh-provisioner".'
    required: false
    default: stunmesh-go
  feedname:
    description: 'Feed name this repo is registered as in feeds.conf'
    required: false
    default: stunmesh
  index:
    description: >-
      Run "make package/index" (and sign it) after building, and collect the
      resulting packages.adb/Packages* alongside the package files. Set to
      '0' when this build covers only one package out of several that will
      share a feed directory: a per-package index would only ever list that
      one package, and the caller (the "feed" job) rebuilds one combined,
      signed index across every package instead.
    required: false
    default: '1'

outputs:
  feed-dir:
    description: 'Directory holding the built package file(s), plus the index when index=1'
    value: out/feed

runs:
  using: composite
  steps:
    - name: Build with the OpenWrt SDK
      uses: openwrt/gh-action-sdk@v11
      env:
        ARCH: ${{ inputs.arch }}-${{ inputs.release }}
        FEEDNAME: ${{ inputs.feedname }}
        PACKAGES: ${{ inputs.package }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        INDEX: ${{ inputs.index }}
        V: s

    - name: Collect packages
      shell: bash
      run: |
        set -eu
        src="bin/packages/${{ inputs.arch }}/${{ inputs.feedname }}"
        mkdir -p out/feed
        found=0
        for pkg in ${{ inputs.package }}; do
          for f in "$src"/"$pkg"*.ipk "$src"/"$pkg"*.apk; do
            [ -e "$f" ] || continue
            cp "$f" out/feed/
            found=1
          done
        done
        [ "$found" = 1 ] || { echo "no package produced in $src" >&2; ls -R bin || true; exit 1; }
        if [ "${{ inputs.index }}" = '1' ]; then
          # The index is what apk fetches first; without it the feed is useless.
          for idx in packages.adb Packages Packages.gz Packages.sig; do
            [ -e "$src/$idx" ] && cp "$src/$idx" out/feed/
          done
          [ -e out/feed/packages.adb ] || [ -e out/feed/Packages ] || { echo "no package index produced in $src" >&2; ls -l "$src"; exit 1; }
        fi
        ls -lR out
