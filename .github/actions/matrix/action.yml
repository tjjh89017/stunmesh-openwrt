name: Discover build matrix
description: List the OpenWrt releases (stable branches with a published SDK image, plus SNAPSHOT) and architectures to build for

inputs:
  min-release:
    description: 'Oldest stable branch to build for'
    required: false
    # go.mod requires Go 1.25; 24.10 ships 1.23, so nothing older than this.
    default: '25.12'
  token:
    description: 'GitHub token for listing openwrt/openwrt branches'
    required: false
    default: ${{ github.token }}

outputs:
  releases:
    description: JSON array of SDK release tags (openwrt-25.12, SNAPSHOT, ...)
    value: ${{ steps.releases.outputs.releases }}
  archs:
    description: JSON array of package architectures
    value: ${{ steps.archs.outputs.archs }}
  packages:
    description: JSON array of every OpenWrt package name, discovered from every "define Package/<name>" in */*/Makefile
    value: ${{ steps.packages.outputs.packages }}
  dirs:
    description: >-
      JSON object mapping each feed directory (Makefile) to the JSON array
      of package names it builds, e.g.
      {"stunmesh-go":["stunmesh-go"],"stunmesh-provisioner":["stunmesh-agent","stunmesh-provd"]}.
      See the "Packages" step below for why a directory can own more than
      one package.
    value: ${{ steps.packages.outputs.dirs }}
  dir_names:
    description: >-
      JSON array of the keys of "dirs" above (its own matrix dimension, for
      the "build" job -- GitHub Actions expressions have no keys() function
      to derive this from "dirs" itself).
    value: ${{ steps.packages.outputs.dir_names }}

runs:
  using: composite
  steps:
    - name: Stable branches with a published SDK image
      id: releases
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MIN_RELEASE: ${{ inputs.min-release }}
      run: |
        set -eu
        # Stable branches are named openwrt-XX.YY; keep those >= MIN_RELEASE.
        branches="$(gh api --paginate repos/openwrt/openwrt/branches -q '.[].name' \
          | grep -E '^openwrt-[0-9]+\.[0-9]+$' | sort -V)"
        # A branch exists before its SDK container does, so probe ghcr too.
        tok="$(curl -fsS 'https://ghcr.io/token?scope=repository:openwrt/sdk:pull' | jq -r .token)"
        have_sdk() {
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/openwrt/sdk/manifests/x86_64-$1")"
          [ "$code" = 200 ]
        }
        releases=""
        for b in $branches; do
          v="${b#openwrt-}"
          [ "$(printf '%s\n%s\n' "$MIN_RELEASE" "$v" | sort -V | head -1)" = "$MIN_RELEASE" ] || continue
          if have_sdk "$b"; then releases="$releases $b"; else echo "::notice::$b has no SDK image yet, skipping"; fi
        done
        releases="$releases SNAPSHOT"
        json="$(printf '%s\n' $releases | jq -R . | jq -sc .)"
        echo "releases=$json" | tee -a "$GITHUB_OUTPUT"

    - name: Architectures
      id: archs
      shell: bash
      run: |
        echo 'archs=["x86_64","aarch64_cortex-a53","aarch64_cortex-a72","aarch64_generic","arm_cortex-a7_neon-vfpv4","arm_cortex-a9_vfpv3-d16","arm_cortex-a15_neon-vfpv4","mipsel_24kc","mips_24kc"]' | tee -a "$GITHUB_OUTPUT"

    - name: Packages
      id: packages
      shell: bash
      run: |
        set -eu
        # A Makefile's own "define Package/<name>...endef" blocks are the
        # actual, independently installable OpenWrt package names it
        # builds -- not the directory name. One Makefile can define more
        # than one package (e.g. net/stunmesh-provisioner/Makefile defines
        # both "stunmesh-agent" and "stunmesh-provd").
        #
        # BUT: OpenWrt's build system only exposes one top-level
        # "make package/<X>/{download,check,compile}" target per Makefile,
        # named after the *directory* it lives in (confirmed the hard way:
        # "make package/stunmesh-provd/download" -> "No rule to make
        # target", because "scripts/feeds install -f stunmesh-provd"
        # resolves the request to its owning source directory,
        # "stunmesh-provisioner", and that is the name every downstream
        # "package/<X>/..." target actually uses). So the CI matrix's own
        # build dimension must be the *directory*, built exactly once, not
        # once per package it owns -- building "stunmesh-provisioner"
        # twice (once "for" each of its two packages) wasted a full SDK
        # compile for no reason. This step emits:
        #   packages:   JSON array of every real package name -- what the
        #               shared index (EXPECTED_PACKAGES in the "feed" job)
        #               must list, and what each final per-package
        #               artifact is named after.
        #   dirs:       JSON object mapping each feed directory to the
        #               JSON array of package names it builds. The
        #               "build" job's matrix dimension is a dir; it looks
        #               up this array to know which packages to pass to
        #               .github/actions/build's "select" input (which
        #               .apk/.ipk files to collect and verify out of that
        #               one directory's one build) and to fan out into
        #               individually named artifacts afterward.
        #   dir_names:  JSON array of "dirs"'s own keys, since GitHub
        #               Actions expressions have no keys() function to
        #               derive a matrix dimension from "dirs" directly.
        #
        # Matching only the bare "define Package/<name>" line (no trailing
        # "/description", "/install", "/conffiles", ...) is what keeps
        # this to real package names. Discovering this from the tree,
        # instead of a hardcoded list, means a new package (or a new
        # sub-package in an existing Makefile) is picked up by CI without
        # editing this workflow.
        packages_json='[]'
        dirs_json='{}'
        for mk in */*/Makefile; do
          dir="$(basename "$(dirname "$mk")")"
          names="$(grep -E '^define Package/[A-Za-z0-9_.+-]+$' "$mk" | sed -E 's#^define Package/##')"
          names_json="$(printf '%s\n' $names | jq -R . | jq -sc 'map(select(length > 0))')"
          dirs_json="$(echo "$dirs_json" | jq -c --arg d "$dir" --argjson n "$names_json" '. + {($d): $n}')"
          for name in $names; do
            packages_json="$(echo "$packages_json" | jq -c --arg n "$name" '. + [$n]')"
          done
        done
        packages_json="$(echo "$packages_json" | jq -c 'sort')"
        dir_names_json="$(echo "$dirs_json" | jq -c 'keys')"
        echo "packages=$packages_json" | tee -a "$GITHUB_OUTPUT"
        echo "dirs=$dirs_json" | tee -a "$GITHUB_OUTPUT"
        echo "dir_names=$dir_names_json" | tee -a "$GITHUB_OUTPUT"
